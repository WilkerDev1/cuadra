[package]
name = "cuadra"
version = "0.1.0"
description = "Cuadra: libreta financiera"
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "cuadra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.7", features = [] }

[dependencies]
# Rangos con "~": que cargo no suba a 3.0.0-alpha.
tauri = { version = "~2.12", features = [] }
tauri-plugin-dialog = "~2.8"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
